name: Publish interactive dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild validated reporting data
        run: python run.py --regenerate
      - name: Check pipeline behavior
        run: python -m unittest discover -s tests -v
      - name: Reconcile interactive filters with SQL
        run: python scripts/check_web_dashboard.py
      - name: Verify reproducible exports
        run: python scripts/check_reproducibility.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy interactive dashboard
        id: deployment
        uses: actions/deploy-pages@v4
